name: Quality and safety

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  safety:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            projects/operations-dashboard/demo/requirements.txt
            projects/fraudguard-community/demo/requirements.txt
      - name: Install demo dependencies
        run: |
          python -m pip install -r projects/operations-dashboard/demo/requirements.txt
          python -m pip install -r projects/fraudguard-community/demo/requirements.txt
      - name: Verify public tree
        shell: pwsh
        run: ./tools/verify-public.ps1
      - name: Compile Python
        shell: pwsh
        run: |
          $files = Get-ChildItem projects,scripts -Recurse -File -Filter *.py
          foreach ($file in $files) { python -m py_compile $file.FullName }
      - name: Run offline demo tests
        shell: pwsh
        run: |
          $demos = Get-ChildItem projects -Directory | ForEach-Object { Join-Path $_.FullName 'demo' }
          foreach ($demo in $demos) {
            Push-Location $demo
            try { python -m unittest discover -v; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE } }
            finally { Pop-Location }
          }
      - name: Run unified synthetic showcase
        run: python scripts/run-showcase.py --check

