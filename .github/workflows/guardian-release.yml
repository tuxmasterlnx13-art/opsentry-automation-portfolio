name: Build GUARDIAN Windows release

on:
  workflow_dispatch:
  push:
    tags:
      - "guardian-v*"

permissions:
  contents: write

jobs:
  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: projects/fraudguard-community/demo/requirements.txt
      - name: Ensure Inno Setup is available
        shell: pwsh
        run: |
          $iscc = Get-ChildItem "${env:ProgramFiles(x86)}\Inno Setup *\ISCC.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $iscc) { choco install innosetup --no-progress -y }
      - name: Build and test installer
        shell: pwsh
        run: ./projects/fraudguard-community/installer/build.ps1
      - name: Create checksum
        shell: pwsh
        run: |
          $installer = "projects/fraudguard-community/installer/output/Guardian-Community-Setup.exe"
          $hash = (Get-FileHash $installer -Algorithm SHA256).Hash
          "$hash  Guardian-Community-Setup.exe" | Set-Content "projects/fraudguard-community/installer/output/SHA256SUMS.txt"
      - uses: actions/upload-artifact@v7
        with:
          name: guardian-community-windows
          path: |
            projects/fraudguard-community/installer/output/Guardian-Community-Setup.exe
            projects/fraudguard-community/installer/output/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
      - name: Publish tagged GitHub Release
        if: startsWith(github.ref, 'refs/tags/guardian-v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:GITHUB_REF_NAME `
            "projects/fraudguard-community/installer/output/Guardian-Community-Setup.exe" `
            "projects/fraudguard-community/installer/output/SHA256SUMS.txt" `
            --title "GUARDIAN Community $env:GITHUB_REF_NAME" `
            --notes-file "projects/fraudguard-community/RELEASE_NOTES_0.4.0.md"
