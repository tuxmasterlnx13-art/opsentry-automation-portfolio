name: Bug report
description: Report reproducible incorrect behavior using synthetic data
title: "[Bug]: "
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Provide safe steps and sanitized inputs. Never include credentials or customer data.
    validations:
      required: true
  - type: input
    id: project
    attributes:
      label: Project
    validations:
      required: true

