name: Feature request
description: Propose a scoped improvement
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What operational problem should this solve?
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: Safety and verification
      description: How should dry-run, approval, audit, and rollback work?
    validations:
      required: true

