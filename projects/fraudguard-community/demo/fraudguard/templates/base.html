<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}GUARDIAN · Fraud Intelligence{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
</head>
<body>
  <div class="sky" aria-hidden="true"></div>
  <div class="nav-wrap">
    <header class="topbar">
      <a class="brand" href="{{ url_for('index') }}" aria-label="Guardian, inicio">
        <img src="{{ url_for('static', filename='guardian-emblem.png') }}" alt="" width="48" height="48">
        <span><strong>GUARDIAN</strong><small data-i18n="brand_tag">Monitor de inconsistencias</small></span>
      </a>
      <div class="topbar-actions"><span class="privacy"><i></i><span data-i18n="local_only">Procesamiento local</span></span><button class="utility-button" id="themeToggle" type="button" aria-label="Cambiar tema">☼ <span data-i18n="theme">Modo claro</span></button><label class="language-control"><span class="sr-only">Idioma</span><select class="utility-button" id="languageSelect" aria-label="Idioma"><option value="es">Español</option><option value="en">English</option><option value="ru">Русский</option><option value="pt">Português</option><option value="fr">Français</option></select></label></div>
    </header>
  </div>
  <main class="shell">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}<div class="notice {{ category }}" role="status">{{ message }}</div>{% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
  <footer><span>GUARDIAN COMMUNITY</span><span data-i18n="footer_line">Explicable · Local · Abierto</span></footer>
  <script src="{{ url_for('static', filename='app.js', v='0.4.0') }}" defer></script>
  <script src="{{ url_for('static', filename='i18n.js', v='0.4.0') }}" defer></script>
</body>
</html>
