<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}GUARDIAN · Fraud Intelligence{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
</head>
<body>
  <div class="sky" aria-hidden="true"></div>
  <div class="nav-wrap">
    <header class="topbar">
      <a class="brand" href="{{ url_for('index') }}" aria-label="Guardian, inicio">
        <img src="{{ url_for('static', filename='guardian-emblem.png') }}" alt="" width="42" height="42">
        <span><strong>GUARDIAN</strong><small>Fraud Intelligence</small></span>
      </a>
      <span class="privacy"><i></i> Procesamiento local</span>
    </header>
  </div>
  <main class="shell">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}<div class="notice {{ category }}" role="status">{{ message }}</div>{% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
  <footer><span>GUARDIAN COMMUNITY</span><span>Explicable · Local · Abierto</span></footer>
</body>
</html>
