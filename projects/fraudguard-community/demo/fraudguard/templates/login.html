{% extends "base.html" %}
{% block title %}Acceso · GUARDIAN{% endblock %}
{% block content %}
<section class="login-card">
  <img class="login-emblem" src="{{ url_for('static', filename='guardian-emblem.png') }}" alt="Emblema Guardian">
  <p class="eyebrow">GUARDIAN · ACCESO DE EMPRESA</p>
  <h1>Ingresa la clave compartida</h1>
  <p>El administrador de la instalación puede darte esta clave. No la envíes fuera de la empresa.</p>
  <form method="post" class="stack">
    <label for="access_key">Clave de acceso</label>
    <input id="access_key" name="access_key" type="password" autocomplete="current-password" required autofocus>
    <button type="submit">Entrar</button>
  </form>
</section>
{% endblock %}
